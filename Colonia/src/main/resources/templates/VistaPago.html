<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago</title>
  <link rel="stylesheet" th:href="@{/styles/Home.css}">
  <link rel="stylesheet" th:href="@{/styles/Pago.css}">
</head>
<body>

<div class="menubar">
  <div class="container menubar_row">
    <nav class="menu" aria-label="Menú principal">
      <a class="menu_link" th:href="@{/home}">Inicio</a>
      <a class="menu_link is-active" th:href="@{/home#admin}">Administración</a>
      <a class="menu_link" th:href="@{/home#ayuda}">Ayuda</a>
      <a class="menu_link" th:href="@{/home#contacto}">Contacto</a>
    </nav>
  </div>
</div>

<main>
  <div class="banner">
    <img th:src="@{/images/Pago.png}" alt="Fondo pago" class="banner_img">
    <div class="banner_overlay">
      <h1>PAGOS</h1>
    </div>
  </div>

  <section class="tabla-seccion">
    <div class="container">

      <div class="divider-line">
        <span>REMISIONES</span>
      </div>

      <div class="title-section">
        <img th:src="@{/images/IconoPago.png}" alt="Icono">
        <h2>REGISTRO DE CONTROL DE PAGOS</h2>
      </div>

      <p class="panel_texto">Aquí se muestra el listado histórico de pagos registrados.</p>


      <div class="tabla-wrapper">
        <table>
          <thead>
          <tr>
            <th>ID</th>
            <th>Residente (ID)</th>
            <th>Clasificación</th>
            <th>Monto</th>
            <th>Fecha de Pago</th>
            <th>Método</th>
            <th>Referencia</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="pago : ${pagos}">
            <td th:text="${pago.idPago}"></td>
            <td th:text="${pago.idResidente}"></td>
            <td th:text="${pago.clasificacionPago}"></td>
            <td th:text="${pago.monto}"></td>
            <td th:text="${pago.fechaPago}"></td>
            <td th:text="${pago.metodo}"></td>
            <td th:text="${pago.referencia}"></td>
          </tr>
          </tbody>
          <section class="pago">

            <div class="tabs">
              <a class="tab tab_activa" href="#">Agregar</a>
              <a class="tab" href="#">Actualizar</a>
              <a class="tab" href="#">Eliminar</a>
              <a class="tab" href="#">Consultar</a>
            </div>
          </section>
        </table>
      </div>
    </div>
  </section>
</main>

</body>
</html>
