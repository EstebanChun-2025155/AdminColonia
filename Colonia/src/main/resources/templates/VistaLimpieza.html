<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Limpieza - Panel Operativo</title>
    <link rel="stylesheet" th:href="@{/style-limpieza.css}">

</head>

<body>

<div class="menubar">
    <div class="menubar_row">
        <nav class="menu">
            <a class="menu_link" th:href="@{/home}">Inicio</a>
            <a class="menu_link is-active" th:href="@{/home#admin}">Administración</a>
            <a class="menu_link" th:href="@{/home#ayuda}">Ayuda</a>
            <a class="menu_link" th:href="@{/home#Contacto}">Contacto</a>
        </nav>
    </div>
</div>

<div class="banner">
    <h1>LIMPIEZA</h1>
</div>

<div class="main-container">

    <div class="divider-line">
        <span>REMISIONES</span>
    </div>

    <div class="title-section">
        <img th:src="@{/Images/icono-de-limpieza.jpg}" alt="Limpieza">
        <h2>REMISIONES DE LIMPIEZA</h2>
    </div>

    <div class="section-description">
        <p>
            Gestión centralizada del personal de mantenimiento.
            Use las herramientas de control inferiores para verificar el estado de las áreas.
        </p>
    </div>

    <div class="tabs">
        <a class="tab" th:href="@{/limpieza/buscar}">Buscar</a>
        <a class="tab" th:href="@{/limpieza/nuevo}">Agregar</a>
        <a class="tab" onclick="editarSeleccionado()">Editar</a>
        <a class="tab" onclick="eliminarSeleccionado()">Eliminar</a>
    </div>

    <table border="1" cellspacing="0" cellpadding="8">

        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Puesto</th>
            <th>Jornada</th>
            <th>Salario</th>
            <th>Teléfono</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="limpieza : ${listaLimpieza}"
            th:attr="data-id=${limpieza.idLimpieza}"
            onclick="seleccionarFila(this)">

            <td th:text="${limpieza.idLimpieza}"></td>
            <td th:text="${limpieza.nombre}"></td>
            <td th:text="${limpieza.puesto}"></td>
            <td th:text="${limpieza.jornada}"></td>
            <td th:text="${limpieza.salario}"></td>
            <td th:text="${limpieza.telefono}"></td>

        </tr>
        </tbody>

    </table>

</div>

<script>
    let idSeleccionado = null;

    function seleccionarFila(fila) {

        document.querySelectorAll("tr").forEach(tr => {
            tr.classList.remove("fila-activa");
        });

        fila.classList.add("fila-activa");

        idSeleccionado = fila.dataset.id;
    }

    function eliminarSeleccionado() {

        if (!idSeleccionado) {
            alert("Selecciona un registro primero");
            return;
        }

        if (confirm("¿Seguro que quieres eliminar este registro?")) {
            window.location.href = "/limpieza/eliminar/" + idSeleccionado;
        }
    }
</script>

</body>
</html>
