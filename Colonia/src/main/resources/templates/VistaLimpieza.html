<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Limpieza - Residencial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/style-limpieza.css}">
</head>

<body>

<div class="menubar">
    <div class="container menubar_row">
        <nav class="menu">
            <a th:href="@{/home}" class="menu_link">Inicio</a>
            <a href="#" class="menu_link is-active">Administración</a>
            <a href="#ayuda" class="menu_link">Ayuda</a>
        </nav>
    </div>
</div>

<div class="banner">
    <h1>LIMPIEZA</h1>
</div>

<div class="container">
    <div class="divider-line">
        <span>CONSULTAS</span>
    </div>

    <h2 class="titulo-central">CONSULTA DE LIMPIEZA</h2>

    <div class="seccion-gestion" style="margin-top: 50px;">
        <p class="subtitulo-naranja">REGISTRO DE LIMPIEZA</p>

        <input type="radio" name="nav" id="r1" th:checked="${tab == null || tab == 'consultar'}" hidden>
        <input type="radio" name="nav" id="r2" th:checked="${tab == 'registrar'}" hidden>
        <input type="radio" name="nav" id="r3" th:checked="${tab == 'editar'}" hidden>

        <div class="tabs-container">
            <label for="r1" class="tab-label">Consultar</label>
            <label for="r2" class="tab-label">Registrar</label>
        </div>

        <div class="panel content1">
            <h3 class="panel-titulo-interno">Consulta de Personal</h3>
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Puesto</th>
                    <th>Jornada</th>
                    <th>Salario</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="limpieza : ${listaLimpieza}">
                    <td th:text="${limpieza.idLimpieza}"></td>
                    <td th:text="${limpieza.nombre}"></td>
                    <td th:text="${limpieza.puesto}"></td>
                    <td th:text="${limpieza.jornada}"></td>
                    <td th:text="${limpieza.salario}"></td>
                    <td class="acciones-cell">
                        <div class="acciones-inline">
                            <a th:href="@{/limpieza/editar/{id}(id=${limpieza.idLimpieza})}" class="action-btn btn-edit-icon">
                                <i class="fas fa-edit"></i>
                            </a>
                            <form th:action="@{'/limpieza/eliminar/' + ${limpieza.idLimpieza}}" method="post" class="inline-form" onsubmit="return confirm('¿Seguro que desea eliminar este registro?');">
                                <button type="submit" class="action-btn btn-danger-icon">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="panel content2">
            <h3 class="panel-titulo-interno">Registrar Nuevo Personal</h3>
            <form th:action="@{/limpieza/guardar}" th:object="${limpiezaForm}" method="post" class="form-estilo">
                <input type="text" th:field="*{nombre}" placeholder="Nombre Completo" required>
                <input type="text" th:field="*{puesto}" placeholder="Puesto" required>
                <input type="text" th:field="*{jornada}" placeholder="Jornada" required>
                <input type="number" step="0.01" th:field="*{salario}" placeholder="Salario (ej: 3000)" required>
                <input type="text" th:field="*{telefono}" placeholder="Teléfono" required>
                <button type="submit" class="btn-naranja-submit">Guardar Registro</button>
            </form>
        </div>

        <div class="panel content3">
            <h3 class="panel-titulo-interno">Editar Información</h3>
            <form th:if="${limpiezaForm.idLimpieza != null}" th:action="@{/limpieza/actualizar}" th:object="${limpiezaForm}" method="post" class="form-estilo">
                <input type="hidden" th:field="*{idLimpieza}">

                <label>Nombre</label>
                <input type="text" th:field="*{nombre}">

                <label>Puesto</label>
                <input type="text" th:field="*{puesto}">

                <label>Jornada</label>
                <input type="text" th:field="*{jornada}">

                <label>Salario</label>
                <input type="number" step="0.01" th:field="*{salario}">

                <label>Teléfono</label>
                <input type="text" th:field="*{telefono}">

                <button type="submit" class="btn-naranja-submit">Actualizar Cambios</button>
                <a th:href="@{/limpieza}" style="display:block; text-align:center; margin-top:10px; color:var(--texto); text-decoration:none;">Cancelar</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
