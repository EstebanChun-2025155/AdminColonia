<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehículos</title>

    <link rel="stylesheet" th:href="@{/Home.css}">
    <link rel="stylesheet" th:href="@{/Vehiculos.css}">
</head>
<body>

<div class="menubar">
    <div class="container menubar_row">
        <nav class="menu">
            <a class="menu_link" th:href="@{/home}">Inicio</a>
            <a class="menu_link" th:href="@{/#admin}">Administración</a>
        </nav>
    </div>
</div>

<main>

    <div class="banner">
        <img class="banner_img" th:src="@{/Images/ImagenVehiculos.png}" alt="Vehículos">
        <div class="banner_overlay">
            <h1>VEHÍCULOS</h1>
        </div>
    </div>

    <section class="tabla-seccion">
        <div class="container">

            <div class="seccion_panel">
                <span>ADMINISTRACIÓN DE VEHÍCULOS</span>
            </div>

            <section class="vista">

                <!-- TABS -->
                <div class="tabs">
                    <a href="#" class="tab tab_activa" data-target="consultar">Consultar</a>
                    <a href="#" class="tab" data-target="registrar">Registrar</a>
                    <a href="#" class="tab" data-target="editar">Editar</a>
                </div>

                <!-- CONSULTAR -->
                <div class="panel panel--tab" id="consultar">
                    <h3 class="panel_titulo">Consulta de Vehículos</h3>

                    <form th:action="@{/vehiculos/buscar}" method="get">
                        <input type="number" name="id" placeholder="Buscar por ID" required>
                        <button type="submit">Buscar</button>
                        <a th:href="@{/vehiculos}">Mostrar Todo</a>
                    </form>

                    <div class="tabla-wrapper">
                        <table>
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Placa</th>
                                <th>Marca / Modelo</th>
                                <th>Color</th>
                                <th>Propietario</th>
                                <th>Casa</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="v : ${vehiculos}">
                                <td th:text="${v.idVehiculo}"></td>
                                <td th:text="${v.placa}"></td>
                                <td th:text="${v.marcaModelo}"></td>
                                <td th:text="${v.color}"></td>
                                <td th:text="${v.propietario}"></td>
                                <td th:text="${v.idCasa}"></td>

                                <td>
                                    <a th:href="@{/vehiculos/editar/{id}(id=${v.idVehiculo})}">
                                        Editar
                                    </a>

                                    <form th:action="@{/vehiculos/eliminar/{id}(id=${v.idVehiculo})}"
                                          method="post"
                                          style="display:inline;">

                                        <button type="submit"
                                                onclick="return confirm('¿Eliminar vehículo?')">
                                            Eliminar
                                        </button>
                                    </form>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(vehiculos)}">
                                <td colspan="7">No hay vehículos registrados.</td>
                            </tr>
                            </tbody>

                        </table>
                    </div>
                </div>

                <!-- REGISTRAR -->
                <div class="panel panel--tab" id="registrar" style="display:none;">
                    <h3 class="panel_titulo">Registrar Vehículo</h3>

                    <form th:action="@{/vehiculos/guardar}"
                          th:object="${vehiculoForm}"
                          method="post">

                        <input type="text" th:field="*{placa}" placeholder="Placa" required>
                        <input type="text" th:field="*{marcaModelo}" placeholder="Marca / Modelo" required>
                        <input type="text" th:field="*{color}" placeholder="Color">
                        <input type="text" th:field="*{propietario}" placeholder="Propietario">
                        <input type="number" th:field="*{idCasa}" placeholder="ID Casa">

                        <button type="submit">Guardar</button>
                    </form>
                </div>

                <!-- EDITAR -->
                <div class="panel panel--tab" id="editar" style="display:none;">
                    <h3 class="panel_titulo">Editar Vehículo</h3>

                    <form th:action="@{/vehiculos/actualizar/{id}(id=${vehiculoForm.idVehiculo})}"
                          th:object="${vehiculoForm}"
                          method="post">

                        <input type="hidden" th:field="*{idVehiculo}">

                        <input type="text" th:field="*{placa}" placeholder="Placa" required>
                        <input type="text" th:field="*{marcaModelo}" placeholder="Marca / Modelo" required>
                        <input type="text" th:field="*{color}" placeholder="Color">
                        <input type="text" th:field="*{propietario}" placeholder="Propietario">
                        <input type="number" th:field="*{idCasa}" placeholder="ID Casa">

                        <button type="submit">Actualizar</button>
                    </form>
                </div>

            </section>
        </div>
    </section>

</main>

<script th:inline="javascript">
    (function(){

        const tabs = document.querySelectorAll('.tab');
        const panels = document.querySelectorAll('.panel--tab');

        function showPanel(id){
            panels.forEach(p => {
                p.style.display = (p.id === id) ? 'block' : 'none';
            });

            tabs.forEach(t => {
                t.classList.toggle('tab_activa', t.dataset.target === id);
            });
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', function(e){
                e.preventDefault();
                showPanel(this.dataset.target);
            });
        });

        const id = [[${vehiculoForm.idVehiculo}]];

        if(id){
            showPanel("editar");
        }else{
            showPanel("consultar");
        }

    })();
</script>

</body>
</html>
