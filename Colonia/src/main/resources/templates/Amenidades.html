<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Amenidades</title>

    <link rel="stylesheet" th:href="@{/Home.css}">
    <link rel="stylesheet" th:href="@{/Amenidades.css}">
</head>
<body>

<div class="menubar">
    <div class="container menubar_row">
        <nav class="menu">
            <a class="menu_link" th:href="@{/home}">Inicio</a>
            <a class="menu_link" th:href="@{/VistaHome#admin}">Administración</a>
        </nav>
    </div>
</div>

<main>

    <div class="banner">
        <img class="banner_img" th:src="@{/Images/ImagenAmenidades.png}" alt="Amenidades">
        <div class="banner_overlay">
            <h1>AMENIDADES</h1>
        </div>
    </div>

    <section class="tabla-seccion">
        <div class="container">

            <div class="seccion_panel">
                <span>ADMINISTRACIÓN DE AMENIDADES</span>
            </div>

            <section class="vista">

                <!-- TABS -->
                <div class="tabs">
                    <a href="#" class="tab tab_activa" data-target="consultar">Consultar</a>
                    <a href="#" class="tab" data-target="registrar">Registrar</a>
                    <a href="#" class="tab" data-target="editar">Editar</a>
                </div>

                <!-- CONSULTAR -->
                <div class="panel panel--tab" id="consultar">
                    <h3 class="panel_titulo">Consulta de Amenidades</h3>

                    <form th:action="@{/amenidades/buscar}" method="get">
                        <input type="number" name="id" placeholder="Buscar por ID" required>
                        <button type="submit">Buscar</button>
                        <a th:href="@{/amenidades}">Mostrar Todo</a>
                    </form>

                    <div class="tabla-wrapper">
                        <table>
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Horario</th>
                                <th>Costo</th>
                                <th>Estado</th>
                                <th>Capacidad</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="a : ${amenidades}">
                                <td th:text="${a.idAmenidad}"></td>
                                <td th:text="${a.nombreAmenidad}"></td>
                                <td th:text="${a.horarioUso}"></td>
                                <td th:text="${a.costoUso}"></td>
                                <td th:text="${a.estado}"></td>
                                <td th:text="${a.capacidad}"></td>

                                <td>
                                    <a th:href="@{/amenidades/editar/{id}(id=${a.idAmenidad})}">
                                        Editar
                                    </a>

                                    <form th:action="@{/amenidades/eliminar/{id}(id=${a.idAmenidad})}"
                                          method="post"
                                          style="display:inline;">

                                        <button type="submit"
                                                onclick="return confirm('¿Eliminar registro?')">
                                            Eliminar
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>

                        </table>
                    </div>
                </div>

                <!-- REGISTRAR -->
                <div class="panel panel--tab" id="registrar" style="display:none;">
                    <h3 class="panel_titulo">Registrar Amenidad</h3>

                    <form th:action="@{/amenidades/guardar}"
                          th:object="${amenidadForm}"
                          method="post">

                        <input type="text" th:field="*{nombreAmenidad}" placeholder="Nombre" required>
                        <input type="text" th:field="*{horarioUso}" placeholder="Horario">
                        <input type="number" step="0.01" th:field="*{costoUso}" placeholder="Costo">
                        <input type="text" th:field="*{estado}" placeholder="Estado">
                        <input type="number" th:field="*{capacidad}" placeholder="Capacidad">

                        <button type="submit">Guardar</button>
                    </form>
                </div>

                <!-- EDITAR -->
                <div class="panel panel--tab" id="editar" style="display:none;">
                    <h3 class="panel_titulo">Editar Amenidad</h3>

                    <form th:action="@{/amenidades/actualizar/{id}(id=${amenidadForm.idAmenidad})}"
                          th:object="${amenidadForm}"
                          method="post">

                        <input type="hidden" th:field="*{idAmenidad}">

                        <input type="text" th:field="*{nombreAmenidad}" placeholder="Nombre" required>
                        <input type="text" th:field="*{horarioUso}" placeholder="Horario">
                        <input type="number" step="0.01" th:field="*{costoUso}" placeholder="Costo">
                        <input type="text" th:field="*{estado}" placeholder="Estado">
                        <input type="number" th:field="*{capacidad}" placeholder="Capacidad">

                        <button type="submit">Actualizar</button>
                    </form>
                </div>

            </section>
        </div>
    </section>

</main>

<script th:inline="javascript">
    (function(){

        const tabs = document.querySelectorAll('.tab');
        const panels = document.querySelectorAll('.panel--tab');

        function showPanel(id){
            panels.forEach(p => {
                p.style.display = (p.id === id) ? 'block' : 'none';
            });

            tabs.forEach(t => {
                t.classList.toggle('tab_activa', t.dataset.target === id);
            });
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', function(e){
                e.preventDefault();
                showPanel(this.dataset.target);
            });
        });

        const id = [[${amenidadForm.idAmenidad}]];

        if(id){
            showPanel("editar");
        }else{
            showPanel("consultar");
        }

    })();
</script>

</body>
</html>
